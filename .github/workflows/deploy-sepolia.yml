name: Deploy fresh stack to Sepolia (TEE server)

# Manual only — a fresh deploy redeploys every Sepolia contract (real gas) and
# restarts the live stack on the TEE server. There is no automatic trigger.
on:
  workflow_dispatch:
    inputs:
      prepare_only:
        description: "Clone + build only — no teardown, no gas, no service restart"
        type: boolean
        default: false
      deploy_dir:
        description: "Clone path on the server, relative to the SSH user's home"
        type: string
        default: "dungeon-deploy/dungeon-demo"

# One deploy at a time; never interrupt an in-flight one (it spends real gas).
concurrency:
  group: deploy-sepolia
  cancel-in-progress: false

# contents: write so the deploy can commit the sanitized manifest/client config back;
# actions: write so it can dispatch deploy-pages.yml afterwards (a GITHUB_TOKEN commit
# can't trigger another workflow, so we trigger the client rebuild explicitly).
permissions:
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Requires repo secrets: TEE_SSH_HOST, TEE_SSH_USER, TEE_SSH_KEY, DEPLOY_ENV.
    # See scripts/remote/deploy.sh for what runs on the server.
    env:
      SSH_HOST: ${{ secrets.TEE_SSH_HOST }}
      SSH_USER: ${{ secrets.TEE_SSH_USER }}
      DEPLOY_DIR: ${{ inputs.deploy_dir }}
      PREPARE_ONLY: ${{ inputs.prepare_only && '1' || '0' }}
      REPO_REF: ${{ github.ref_name }}
    steps:
      - name: Checkout (for committing the manifest)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.TEE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host target
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Sync the repo to the server
        run: |
          # Push the runner's authenticated checkout (works for a private repo) to the
          # server, so the server needs no GitHub credentials. Stop the systemd units
          # first so Restart=always doesn't run against half-replaced files, and
          # preserve .run/ (chain + indexer state) and node_modules — deploy.sh's FRESH
          # bootstrap wipes the stateful bits itself. .git is excluded (the deploy
          # reads GIT_REF/GIT_SHA from the env).
          ssh target "sudo systemctl stop 'dungeon-*.service' 2>/dev/null || true; mkdir -p \"\$HOME/$DEPLOY_DIR\""
          rsync -az --delete \
            --exclude '.git' --exclude '.run' --exclude 'node_modules' --exclude 'app/node_modules' \
            -e ssh ./ "target:$DEPLOY_DIR/"

      - name: Install .env on the server
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          # Pipe the secret to the server over stdin so it never lands in a command
          # line, a log line, or a file on the GitHub runner.
          printf '%s' "$DEPLOY_ENV" | ssh target "cat > '$DEPLOY_DIR/.env' && chmod 600 '$DEPLOY_DIR/.env' && echo '→ wrote .env'"

      - name: Run the fresh deploy
        run: |
          ssh target "cd \"\$HOME/$DEPLOY_DIR\" && GIT_REF='$REPO_REF' GIT_SHA='${{ github.sha }}' PREPARE_ONLY='$PREPARE_ONLY' bash scripts/remote/deploy.sh"

      - name: Commit manifest + client config
        id: client
        if: ${{ inputs.prepare_only == false }}
        env:
          # Public reverse-proxy base for the loopback-bound services (nginx vhost
          # on the server). Override with a repo variable if the domain changes.
          PUBLIC_BACKEND_URL: ${{ vars.PUBLIC_BACKEND_URL || 'https://dungeon-backend.cartridge.gg' }}
        run: |
          # Pull the sanitized manifest dir off the server (no private keys — see
          # the manifest() step in scripts/remote/deploy.sh) into this checkout.
          ssh target "cd \"\$HOME/$DEPLOY_DIR\" && tar cf - deployments" | tar xf -
          # Regenerate the client config (deployments.json) the Vite app bundles:
          # fresh addresses from the manifest + the public backend URLs.
          network=$(ssh target "node -e 'console.log(require(process.env.HOME + \"/$DEPLOY_DIR/deployments.json\").settlement.network)'")
          node scripts/gen-client-deployments.mjs "deployments/$network.json" "$PUBLIC_BACKEND_URL" deployments.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments deployments.json
          if git diff --cached --quiet; then
            echo "→ manifest + client config unchanged — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: record deployment manifest + client config"
            git push origin "HEAD:$REPO_REF"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild + publish the client (deploy-pages)
        if: ${{ inputs.prepare_only == false && steps.client.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A GITHUB_TOKEN-authored commit does NOT trigger another workflow, so the
          # deployments.json push above won't fire deploy-pages.yml on its own. Dispatch
          # it explicitly: it rebuilds the Vite client from $REPO_REF (now carrying the
          # fresh deployments.json) and republishes to Pages, so the live client tracks
          # this deploy automatically.
          gh workflow run deploy-pages.yml --ref "$REPO_REF"
          echo "→ dispatched deploy-pages.yml on $REPO_REF — client will rebuild with the new config"
