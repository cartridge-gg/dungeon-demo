[package]
name = "cross_chain_dungeon_score"
version = "0.1.0"
edition = "2024_07"
cairo-version = "2.13"

[dependencies]
starknet = "2.13"
# Dojo from the Scarb registry (scarbs.xyz), pinned to 1.8.0 — the crate version
# behind `sozo` 1.8.7, so the world class hash matches the installed toolchain.
dojo = "1.8.0"
dojo_cairo_macros = "1.8.0"

[[target.starknet-contract]]
sierra = true
casm = true
build-external-contracts = ["dojo::world::world_contract::world"]
